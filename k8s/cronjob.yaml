# repos list (one clone URL per line)
apiVersion: v1
kind: ConfigMap
metadata:
  name: commit-audit-repos
data:
  repos: |
    https://gitlab.az.abssrv.it/innovation/ces-ai-agents.git
    https://github.com/acarmisc/backstage-plugin-ai-agents.git
---
# created out-of-band:
#   kubectl -n kagent create secret generic commit-audit-secrets \
#     --from-literal=GITHUB_TOKEN=... --from-literal=GITLAB_TOKEN=... \
#     --from-literal=LITELLM_KEY=... --from-literal=SLACK_WEBHOOK_URL=...
# (shared with the kagent MCPServer in k8s/kagent.yaml)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: commit-audit
spec:
  schedule: "0 8 * * *" # daily 08:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: audit
              image: europe-west1-docker.pkg.dev/abs-digital-playground/agents/commit-audit:0.3.0
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  CMD="audit --period day"
                  while IFS= read -r r; do
                    [ -n "$r" ] && CMD="$CMD --repo $r"
                  done < /etc/audit/repos
                  exec $CMD
              envFrom:
                - secretRef:
                    name: commit-audit-secrets
              volumeMounts:
                - name: repos
                  mountPath: /etc/audit/repos
                  subPath: repos
                  readOnly: true
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: repos
              configMap:
                name: commit-audit-repos
